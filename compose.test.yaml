services:
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
      target: test
    environment:
      TEST_DATABASE_URL: postgres://bulletin:bulletin@postgres:5432/postgres
      # Tests and seed data derive public origins from the same port as the stack.
      BULLETIN_HTTP_PORT: "${BULLETIN_HTTP_PORT:-8080}"
      BULLETIN_AUTH_ISSUER: "http://auth.bulletin.localhost:${BULLETIN_HTTP_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - test
