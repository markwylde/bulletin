name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: bun run check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run check

  integration:
    name: Compose database/integration tests
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: ci-${{ github.run_id }}-integration
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Run the test service
        run: docker compose -f compose.yaml -f compose.test.yaml --profile test run --rm --build test
      - name: Stop the stack
        if: always()
        run: docker compose -f compose.yaml -f compose.test.yaml down -v --rmi local

  e2e:
    # Shard 0 runs the full-stack checks (sandbox, integration, benchmark); shards 1-8 split
    # the browser E2E files between them. Each shard brings up its own stack.
    name: ${{ matrix.shard == 0 && 'Full-stack checks' || format('E2E {0}/8', matrix.shard) }} (${{ matrix.engine }})
    runs-on: ubuntu-latest
    env:
      # Container runners cannot bind-mount files from the job checkout (compose.ci.yaml).
      COMPOSE_FILE: compose.yaml:compose.ci.yaml
      # Runners share one Docker daemon: isolate each shard's containers, images and volumes.
      COMPOSE_PROJECT_NAME: ci-${{ github.run_id }}-e2e-${{ matrix.engine }}-${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        # Podman needs a runner that can run containers inside the job; run it on demand.
        engine: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["docker","podman"]') || fromJSON('["docker"]') }}
        shard: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile

      - name: Install Podman and the Compose v2 provider
        if: matrix.engine == 'podman'
        run: |
          apt-get update
          apt-get install -y podman
          curl -fsSL \
            https://github.com/docker/compose/releases/download/v2.30.3/docker-compose-linux-x86_64 \
            -o /usr/local/bin/docker-compose
          chmod +x /usr/local/bin/docker-compose
          podman info

      - name: Install pinned Chrome for E2E
        if: matrix.shard != 0
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: 131.0.6778.85
          install-dependencies: true

      - name: Point Bun.WebView at the pinned Chrome
        if: matrix.shard != 0
        run: |
          echo "BUN_CHROME_PATH=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
          "${{ steps.setup-chrome.outputs.chrome-path }}" --version

      - name: Pick a per-shard proxy port
        # Gitea job containers share the daemon host's network, so concurrent runs and shards
        # must not all publish 8080. The port flows into every origin via BULLETIN_HTTP_PORT.
        run: |
          echo "BULLETIN_HTTP_PORT=$((20000 + (${{ github.run_id }} % 4000) * 10 + ${{ matrix.shard }}))" >> "$GITHUB_ENV"

      - name: Start the full stack
        run: |
          if [ "${{ matrix.engine }}" = "podman" ]; then
            podman compose up -d --build --wait --wait-timeout 300
          else
            docker compose up -d --build --wait --wait-timeout 300
          fi

      - name: Resolve the local origins
        # glibc does not resolve *.localhost subdomains, but Bun's fetch in the suites needs them.
        run: |
          echo "127.0.0.1 bulletin.localhost staff.bulletin.localhost files.bulletin.localhost plugins.bulletin.localhost auth.bulletin.localhost" \
            | tee -a /etc/hosts

      - name: Check the proxy is reachable
        run: |
          curl -fsS -o /dev/null -w "proxy reachable: %{http_code}\n" "http://bulletin.localhost:$BULLETIN_HTTP_PORT/"

      - name: Measure sandbox spawn time and memory
        if: matrix.shard == 0
        run: |
          if [ "${{ matrix.engine }}" = "podman" ]; then
            podman compose exec -T \
              -e PLUGIN_HOST_ENGINE=podman -e PLUGIN_HOST_MEASURE_ITERATIONS=10 \
              plugin-host bun apps/plugin-host/src/demo/measure.ts
          else
            docker compose exec -T \
              -e PLUGIN_HOST_ENGINE=docker -e PLUGIN_HOST_MEASURE_ITERATIONS=10 \
              plugin-host bun apps/plugin-host/src/demo/measure.ts
          fi

      - name: Run malicious-plugin suite
        if: matrix.shard == 0
        run: |
          if [ "${{ matrix.engine }}" = "podman" ]; then
            podman compose exec -T -e BULLETIN_SANDBOX_TESTS=1 plugin-host \
              bun test apps/plugin-host/src/malicious/malicious.test.ts
          else
            docker compose exec -T -e BULLETIN_SANDBOX_TESTS=1 plugin-host \
              bun test apps/plugin-host/src/malicious/malicious.test.ts
          fi

      - name: Run full-stack integration suites
        if: matrix.shard == 0
        run: bun run test:integration

      - name: Latency benchmark (ADR 0006)
        if: matrix.shard == 0
        run: bun run benchmark

      - name: Run E2E shard
        if: matrix.shard != 0
        run: bun run test:e2e --shard=${{ matrix.shard }}/8

      - name: Diagnose plugin sandbox syscalls
        if: failure()
        run: ${{ matrix.engine }} compose exec -T plugin-host sh < scripts/ci/diagnose-sandbox.sh || true

      - name: Collect logs
        if: failure()
        run: |
          if [ "${{ matrix.engine }}" = "podman" ]; then
            podman compose logs --no-color
          else
            docker compose logs --no-color
          fi

      - name: Stop the stack
        if: always()
        run: |
          if [ "${{ matrix.engine }}" = "podman" ]; then
            podman compose down -v --rmi local
          else
            docker compose down -v --rmi local
          fi
