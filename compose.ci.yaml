# CI-only overrides for container-based runners (Gitea act runners).
#
# Jobs run inside a container that talks to the host's Docker daemon, so bind mounts of
# files from the job's checkout resolve on the host and come up empty. These services
# read their config from the image (or a tiny build) instead. Used via COMPOSE_FILE in
# .github/workflows/ci.yml; local development keeps the bind mounts in compose.yaml.
#
# Images are built once per run by the `images` job and tagged with CI_IMAGE_TAG; every
# E2E shard then starts its stack from them with `up --no-build`.
services:
  darkauth-mock:
    image: bulletin-ci-darkauth-mock:${CI_IMAGE_TAG:-local}
    volumes: !reset []
    environment:
      # The mock image already contains the whole repository at /app.
      DARKAUTH_MOCK_CONFIG: /app/darkauth-mock.yaml

  proxy:
    image: bulletin-ci-proxy:${CI_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile_inline: |
        FROM caddy:2.11.9-alpine
        COPY apps/proxy/Caddyfile /etc/caddy/Caddyfile
    volumes: !reset []
    # Job containers share the daemon host's network; CI picks a per-run port and keeps it
    # on loopback.
    ports: !override
      - "127.0.0.1:${BULLETIN_HTTP_PORT:-8080}:${BULLETIN_HTTP_PORT:-8080}"

  cdn:
    image: bulletin-ci-cdn:${CI_IMAGE_TAG:-local}

  mail:
    image: bulletin-ci-mail:${CI_IMAGE_TAG:-local}

  marketplace:
    image: bulletin-ci-marketplace:${CI_IMAGE_TAG:-local}

  oembed:
    image: bulletin-ci-oembed:${CI_IMAGE_TAG:-local}

  plugin-host:
    image: bulletin-ci-plugin-host:${CI_IMAGE_TAG:-local}

  push:
    image: bulletin-ci-push:${CI_IMAGE_TAG:-local}

  s3:
    image: bulletin-ci-s3:${CI_IMAGE_TAG:-local}

  staff-api:
    image: bulletin-ci-staff-api:${CI_IMAGE_TAG:-local}

  staff-app:
    image: bulletin-ci-staff-app:${CI_IMAGE_TAG:-local}

  user-api:
    image: bulletin-ci-user-api:${CI_IMAGE_TAG:-local}

  user-app:
    image: bulletin-ci-user-app:${CI_IMAGE_TAG:-local}

  webhooks:
    image: bulletin-ci-webhooks:${CI_IMAGE_TAG:-local}

  workers:
    image: bulletin-ci-workers:${CI_IMAGE_TAG:-local}
