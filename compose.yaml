      push:
        condition: service_healthy
      webhooks:
        condition: service_healthy
      oembed:
        condition: service_healthy
      cdn:
        condition: service_healthy
      marketplace:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null --header 'Host: bulletin.localhost'
