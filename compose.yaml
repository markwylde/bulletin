          path: ./bun.lock
        - action: rebuild
          path: ./mocks/marketplace/package.json
        - action: rebuild
          path: ./mocks/Dockerfile
    restart: unless-stopped

  proxy:
    image: caddy:2.11.9-alpine
    environment:
      # Caddy site addresses use the same port, so the Host the browser sends matches.
      BULLETIN_HTTP_PORT: "${BULLETIN_HTTP_PORT:-8080}"
    ports:
      - "${BULLETIN_HTTP_PORT:-8080}:${BULLETIN_HTTP_PORT:-8080}"
    volumes:
      - ./apps/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      user-app:
        condition: service_healthy
      user-api:
        condition: service_healthy
      staff-app:
        condition: service_healthy
      staff-api:
        condition: service_healthy
      plugin-host:
        condition: service_healthy
      darkauth-mock:
        condition: service_healthy
      s3:
        condition: service_healthy
      mail:
        condition: service_healthy
      push:
        condition: service_healthy
      webhooks:
        condition: service_healthy
      oembed:
        condition: service_healthy
      cdn:
        condition: service_healthy
      marketplace:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null --header 'Host: bulletin.localhost'
          http://127.0.0.1:${BULLETIN_HTTP_PORT:-8080}/
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  user-app:
    build:
      context: .
      dockerfile: apps/user-app/Dockerfile
      target: dev
    environment:
      <<: *app-environment
      PORT: "4321"
      DATABASE_URL: postgres://user_app@postgres:5432/bulletin
      USER_API_INTERNAL_URL: http://user-api:3001
      S3_ENDPOINT: http://s3:4001/_mocks/s3
      S3_BUCKET: bulletin
      S3_ACCESS_KEY_ID: bulletin
      S3_SECRET_ACCESS_KEY: bulletin-secret
      S3_REGION: us-east-1
