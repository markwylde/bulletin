name: bulletin

x-app-environment: &app-environment
  NODE_ENV: development
  LOG_LEVEL: info
  # Local-only defaults (ADR 0002). packages/config rejects them in production.
  SESSION_SECRET: bulletin-development-only-session-secret
  SEED: "42"
  SEED_SIZE: default

x-depends-on-postgres: &depends-on-postgres
  postgres:
    condition: service_healthy

x-mock-build: &mock-build
  context: .
  dockerfile: mocks/Dockerfile
  target: dev

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 5s
  retries: 30
  start_period: 30s

x-bun-healthcheck: &bun-healthcheck
  <<: *healthcheck
  test:
    - CMD
    - bun
    - -e
    - >-
      fetch("http://127.0.0.1:" + (process.env.PORT ?? "3000") + "/")
      .then((response) => process.exit(response.ok ? 0 : 1))
      .catch(() => process.exit(1))

x-service-healthcheck: &service-healthcheck
  <<: *healthcheck
  test:
    - CMD
    - bun
    - -e
    - >-
      fetch("http://127.0.0.1:" + (process.env.PORT ?? "3000") + "/health/ready")
      .then((response) => process.exit(response.ok ? 0 : 1))
      .catch(() => process.exit(1))

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: bulletin
      POSTGRES_USER: bulletin
      POSTGRES_PASSWORD: bulletin
      # Local development only: role logins have no passwords. Never use this in production.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bulletin -d bulletin"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  darkauth-mock:
    # Pinned digest of ghcr.io/puzed/darkauth-mock:latest (multi-arch index).
    image: ghcr.io/puzed/darkauth-mock@sha256:9c40595bdd3e49bb26d9f0f0ba07c32d2fb3540d52bf70f574261cc74c0e6b3b
    environment:
      DARKAUTH_MOCK_CONFIG: /data/darkauth-mock.yaml
    # The image writes its signing key into the persistent volume. The checked-in file is
    # only a template, so restarts keep the same key without mutating the repo.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ ! -s /data/darkauth-mock.yaml ]; then
          cp /config/darkauth-mock.yaml /data/darkauth-mock.yaml
          chown 1000:1000 /data/darkauth-mock.yaml
          chmod 600 /data/darkauth-mock.yaml
        fi
        exec docker-entrypoint node packages/darkauth-mock/src/main.ts
    command: []
    volumes:
      - darkauth-mock-data:/data
      - ./darkauth-mock.yaml:/config/darkauth-mock.yaml:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch("http://127.0.0.1:3020/.well-known/jwks.json")
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  s3:
    build:
      context: .
      dockerfile: mocks/Dockerfile
      target: dev
      args:
        MOCK_NAME: s3
    environment:
      PORT: "4001"
      MOCK_BASE_PATH: /_mocks/s3
      DATABASE_URL: postgres://bulletin:bulletin@postgres:5432/bulletin
      S3_BUCKET: bulletin
      S3_ACCESS_KEY_ID: bulletin
      S3_SECRET_ACCESS_KEY: bulletin-secret
      S3_REGION: us-east-1
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - >-
          fetch("http://127.0.0.1:4001/_mocks/s3/health")
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on: *depends-on-postgres
    develop:
      watch:
        - action: sync
          path: ./mocks/s3/src
          target: /app/mocks/s3/src
        - action: sync
          path: ./mocks/shared/src
          target: /app/mocks/shared/src
        - action: sync+restart
          path: ./mocks/s3/tsconfig.json
          target: /app/mocks/s3/tsconfig.json
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./bun.lock
        - action: rebuild
          path: ./tsconfig.base.json
        - action: rebuild
          path: ./mocks/s3/package.json
        - action: rebuild
          path: ./mocks/shared/package.json
        - action: rebuild
          path: ./mocks/Dockerfile
    restart: unless-stopped

  mail:
