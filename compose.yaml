            - "**/dist/**"
        - action: sync+restart
          path: ./packages/db/migrations
          target: /app/packages/db/migrations
        - action: sync+restart
          path: ./apps/user-api/tsconfig.json
          target: /app/apps/user-api/tsconfig.json
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./bun.lock
        - action: rebuild
          path: ./packages/db/package.json
        - action: rebuild
          path: ./packages/domain/package.json
        - action: rebuild
          path: ./packages/cache/package.json
        - action: rebuild
          path: ./packages/content/package.json
        - action: rebuild
          path: ./packages/templates/package.json
        - action: rebuild
          path: ./packages/plugin-sdk/package.json
        - action: rebuild
          path: ./packages/i18n/package.json
        - action: rebuild
          path: ./packages/flags/package.json
        - action: rebuild
          path: ./packages/storage/package.json
        - action: rebuild
          path: ./packages/ui/package.json
        - action: rebuild
          path: ./packages/config/package.json
        - action: rebuild
          path: ./packages/test-utils/package.json
        - action: rebuild
          path: ./tsconfig.base.json
        - action: rebuild
