      <<: *mock-build
      args:
        MOCK_NAME: webhooks
    environment:
      PORT: "4004"
      WEBHOOK_SECRET: bulletin-dev-webhook-secret
    healthcheck: *bun-healthcheck
    develop:
      watch:
        - action: sync
          path: ./mocks/webhooks/src
          target: /app/mocks/webhooks/src
        - action: sync
          path: ./mocks/shared/src
          target: /app/mocks/shared/src
        - action: rebuild
          path: ./bun.lock
        - action: rebuild
          path: ./mocks/webhooks/package.json
        - action: rebuild
          path: ./mocks/Dockerfile
    restart: unless-stopped

  oembed:
    build:
      <<: *mock-build
      args:
        MOCK_NAME: oembed
    environment:
      PORT: "4005"
      BULLETIN_PUBLIC_ORIGIN: "http://bulletin.localhost:${BULLETIN_HTTP_PORT:-8080}"
    healthcheck: *bun-healthcheck
    develop:
      watch:
        - action: sync
          path: ./mocks/oembed/src
          target: /app/mocks/oembed/src
        - action: sync
          path: ./mocks/shared/src
          target: /app/mocks/shared/src
        - action: rebuild
          path: ./bun.lock
        - action: rebuild
