          path: ./mocks/Dockerfile
    restart: unless-stopped

  cdn:
    build:
      <<: *mock-build
      args:
        MOCK_NAME: cdn
    environment:
      PORT: "4006"
      CDN_ORIGIN: http://user-app:4321
      CDN_UPSTREAM_HOST: bulletin.localhost
