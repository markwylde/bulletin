          target: /app/mocks/mail/tsconfig.json
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./bun.lock
        - action: rebuild
          path: ./tsconfig.base.json
        - action: rebuild
          path: ./mocks/mail/package.json
        - action: rebuild
          path: ./mocks/shared/package.json
        - action: rebuild
          path: ./mocks/Dockerfile
    restart: unless-stopped

  push:
    build:
      <<: *mock-build
      args:
        MOCK_NAME: push
    environment:
      PORT: "4003"
    healthcheck: *bun-healthcheck
    develop:
      watch:
