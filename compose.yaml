        - action: rebuild
          path: ./packages/storage/package.json
        - action: rebuild
          path: ./packages/ui/package.json
        - action: rebuild
          path: ./packages/config/package.json
        - action: rebuild
          path: ./packages/test-utils/package.json
        - action: rebuild
          path: ./tsconfig.base.json
        - action: rebuild
          path: ./apps/workers/package.json
        - action: rebuild
          path: ./apps/workers/Dockerfile

  plugin-host:
    build:
      context: .
      dockerfile: apps/plugin-host/Dockerfile
      target: dev
    environment:
      <<: *app-environment
      PORT: "3004"
      DATABASE_URL: postgres://bulletin:bulletin@postgres:5432/bulletin
    # The only privileged container: nsjail needs SYS_ADMIN for namespaces, mounts and the
    # cgroup hierarchy. It drops to the per-plugin UID and installs its own seccomp filter.
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
      - label=disable
    # cgroupns=host so nsjail can create one cgroup v2 child per sandbox.
    cgroup: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    healthcheck: *service-healthcheck
    restart: unless-stopped
    depends_on: *depends-on-postgres
    develop:
      watch:
        - action: sync
          path: ./apps/plugin-host/src
          target: /app/apps/plugin-host/src
        - action: sync
          path: ./packages
          target: /app/packages
          ignore:
            - "**/node_modules/**"
            - "**/dist/**"
        - action: sync+restart
          path: ./apps/plugin-host/tsconfig.json
          target: /app/apps/plugin-host/tsconfig.json
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./bun.lock
        - action: rebuild
          path: ./packages/db/package.json
        - action: rebuild
          path: ./packages/domain/package.json
        - action: rebuild
          path: ./packages/cache/package.json
        - action: rebuild
          path: ./packages/content/package.json
        - action: rebuild
          path: ./packages/templates/package.json
        - action: rebuild
          path: ./packages/plugin-sdk/package.json
        - action: rebuild
          path: ./packages/i18n/package.json
        - action: rebuild
          path: ./packages/flags/package.json
        - action: rebuild
          path: ./packages/storage/package.json
        - action: rebuild
          path: ./packages/ui/package.json
        - action: rebuild
          path: ./packages/config/package.json
        - action: rebuild
          path: ./packages/test-utils/package.json
        - action: rebuild
          path: ./tsconfig.base.json
        - action: rebuild
          path: ./apps/plugin-host/package.json
        - action: rebuild
          path: ./apps/plugin-host/Dockerfile

volumes:
  postgres-data:
  darkauth-mock-data:
