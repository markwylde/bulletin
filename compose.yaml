# The project name is env-driven so parallel checkouts get separate containers and
# volumes; default to `bulletin` for the documented two-step flow (ADR 0002).
name: ${COMPOSE_PROJECT_NAME:-bulletin}

x-app-environment: &app-environment
  NODE_ENV: development
  LOG_LEVEL: info
  # Every public origin follows the published port (ADR 0018). The default keeps the
  # documented `http://bulletin.localhost:8080` entry point.
  BULLETIN_HTTP_PORT: "${BULLETIN_HTTP_PORT:-8080}"
  BULLETIN_AUTH_ISSUER: "http://auth.bulletin.localhost:${BULLETIN_HTTP_PORT:-8080}"
  BULLETIN_USER_ORIGIN: "http://bulletin.localhost:${BULLETIN_HTTP_PORT:-8080}"
  BULLETIN_STAFF_ORIGIN: "http://staff.bulletin.localhost:${BULLETIN_HTTP_PORT:-8080}"
  BULLETIN_PLUGINS_ORIGIN: "http://plugins.bulletin.localhost:${BULLETIN_HTTP_PORT:-8080}"
  # Local SMTP is the mail mock; workers only.
  BULLETIN_SMTP_URL: "smtp://mail:1025"
  BULLETIN_MAIL_FROM: "Bulletin <no-reply@bulletin.localhost>"
  BULLETIN_FILES_ORIGIN: "http://files.bulletin.localhost:${BULLETIN_HTTP_PORT:-8080}"
  # The CDN mock's surrogate-key purge endpoint (ADR 0006). Set on staff-api and workers.
  BULLETIN_CDN_PURGE_URL: "http://cdn:4006/purge"
  # Presigned URLs point at the files origin, never at the internal S3 endpoint (ADR 0019).
  S3_PUBLIC_ENDPOINT: "http://files.bulletin.localhost:${BULLETIN_HTTP_PORT:-8080}/_mocks/s3"
  # Core→plugin-host hook calls and the broker→core signed token (ADR 0009).
  PLUGIN_HOST_INTERNAL_URL: "http://plugin-host:3004"
  PLUGIN_INTERNAL_TOKEN: bulletin-development-only-internal-token
  PLUGIN_CORE_BROKER_TOKEN: bulletin-development-only-broker-secret
  PLUGIN_CORE_API_URL: "http://user-api:3001"
  BULLETIN_MARKETPLACE_URL: "http://marketplace:4007"
  # Local-only defaults (ADR 0002). packages/config rejects them in production.
  SESSION_SECRET: bulletin-development-only-session-secret
  SEED: "42"
  SEED_SIZE: "${SEED_SIZE:-default}"

x-depends-on-postgres: &depends-on-postgres
  postgres:
    condition: service_healthy

x-mock-build: &mock-build
  context: .
  dockerfile: mocks/Dockerfile
  target: dev

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 5s
  retries: 30
  start_period: 30s

x-bun-healthcheck: &bun-healthcheck
  <<: *healthcheck
  test:
    - CMD
    - bun
    - -e
    - >-
      fetch("http://127.0.0.1:" + (process.env.PORT ?? "3000") + "/")
      .then((response) => process.exit(response.ok ? 0 : 1))
      .catch(() => process.exit(1))

x-service-healthcheck: &service-healthcheck
  <<: *healthcheck
  test:
    - CMD
    - bun
    - -e
    - >-
      fetch("http://127.0.0.1:" + (process.env.PORT ?? "3000") + "/health/ready")
      .then((response) => process.exit(response.ok ? 0 : 1))
      .catch(() => process.exit(1))

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: bulletin
      POSTGRES_USER: bulletin
      POSTGRES_PASSWORD: bulletin
      # Local development only: role logins have no passwords. Never use this in production.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bulletin -d bulletin"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  darkauth-mock:
    build:
      context: .
      dockerfile: mocks/Dockerfile
      target: dev
      args:
        MOCK_NAME: darkauth
    environment:
      PORT: "3020"
      DARKAUTH_MOCK_CONFIG: /config/darkauth-mock.yaml
      DARKAUTH_MOCK_DATA_DIR: /data
      # Overrides the issuer and redirect origins from darkauth-mock.yaml so the mock
      # stays consistent with the published port.
      DARKAUTH_MOCK_ISSUER: "http://auth.bulletin.localhost:${BULLETIN_HTTP_PORT:-8080}"
      DARKAUTH_MOCK_ALLOWED_ORIGINS: "http://bulletin.localhost:${BULLETIN_HTTP_PORT:-8080},http://staff.bulletin.localhost:${BULLETIN_HTTP_PORT:-8080},http://auth.bulletin.localhost:${BULLETIN_HTTP_PORT:-8080}"
    volumes:
      - darkauth-mock-data:/data
      - ./darkauth-mock.yaml:/config/darkauth-mock.yaml:ro
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - >-
          fetch("http://127.0.0.1:3020/.well-known/jwks.json")
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    develop:
      watch:
        - action: sync
          path: ./mocks/darkauth/src
          target: /app/mocks/darkauth/src
        - action: rebuild
          path: ./mocks/darkauth/package.json
        - action: rebuild
          path: ./bun.lock
    restart: unless-stopped

  s3:
    build:
      context: .
      dockerfile: mocks/Dockerfile
      target: dev
      args:
        MOCK_NAME: s3
    environment:
      PORT: "4001"
      MOCK_BASE_PATH: /_mocks/s3
      DATABASE_URL: postgres://bulletin:bulletin@postgres:5432/bulletin
      S3_BUCKET: bulletin
      S3_ACCESS_KEY_ID: bulletin
      S3_SECRET_ACCESS_KEY: bulletin-secret
      S3_REGION: us-east-1
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - >-
          fetch("http://127.0.0.1:4001/_mocks/s3/health")
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on: *depends-on-postgres
    develop:
      watch:
        - action: sync
          path: ./mocks/s3/src
          target: /app/mocks/s3/src
        - action: sync
          path: ./mocks/shared/src
          target: /app/mocks/shared/src
        - action: sync+restart
          path: ./mocks/s3/tsconfig.json
          target: /app/mocks/s3/tsconfig.json
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./bun.lock
        - action: rebuild
          path: ./tsconfig.base.json
        - action: rebuild
          path: ./mocks/s3/package.json
        - action: rebuild
          path: ./mocks/shared/package.json
        - action: rebuild
          path: ./mocks/Dockerfile
    restart: unless-stopped

  mail:
    build:
      context: .
      dockerfile: mocks/Dockerfile
      target: dev
      args:
        MOCK_NAME: mail
    environment:
      PORT: "4002"
      SMTP_PORT: "1025"
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - >-
          fetch("http://127.0.0.1:4002/health")
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    develop:
      watch:
        - action: sync
          path: ./mocks/mail/src
          target: /app/mocks/mail/src
        - action: sync
          path: ./mocks/shared/src
          target: /app/mocks/shared/src
        - action: sync+restart
          path: ./mocks/mail/tsconfig.json
          target: /app/mocks/mail/tsconfig.json
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./bun.lock
        - action: rebuild
          path: ./tsconfig.base.json
        - action: rebuild
          path: ./mocks/mail/package.json
        - action: rebuild
          path: ./mocks/shared/package.json
        - action: rebuild
          path: ./mocks/Dockerfile
    restart: unless-stopped

  push:
    build:
      <<: *mock-build
      args:
        MOCK_NAME: push
    environment:
      PORT: "4003"
    healthcheck: *bun-healthcheck
    develop:
      watch:
        - action: sync
          path: ./mocks/push/src
