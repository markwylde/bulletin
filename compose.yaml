      PORT: "3001"
      DATABASE_URL: postgres://user_api@postgres:5432/bulletin
      MIGRATION_DATABASE_URL: postgres://bulletin:bulletin@postgres:5432/bulletin
      S3_ENDPOINT: http://s3:4001/_mocks/s3
      S3_BUCKET: bulletin
      S3_ACCESS_KEY_ID: bulletin
      S3_SECRET_ACCESS_KEY: bulletin-secret
      S3_REGION: us-east-1
      BULLETIN_AUTH_JWKS_URL: http://darkauth-mock:3020/.well-known/jwks.json
      BULLETIN_AUTH_TOKEN_URL: http://darkauth-mock:3020/token
      BULLETIN_MARKETPLACE_URL: http://marketplace:4007
      BULLETIN_BOOTSTRAP_ADMINS: "http://auth.bulletin.localhost:${BULLETIN_HTTP_PORT:-8080}|admin"
