<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Tip jar</title>
    <style>
      /* Follows the host's colour scheme: the frame stays transparent in light and dark. */
      :root { color-scheme: light dark; }
      body { font: 14px system-ui, sans-serif; margin: 0; padding: 4px 0; background: transparent; color: CanvasText; }
      button {
        padding: 6px 10px;
        border: 1px solid color-mix(in srgb, CanvasText 22%, transparent);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      button:hover { background: color-mix(in srgb, CanvasText 6%, transparent); }
    </style>
  </head>
  <body>
    <button type="button" id="tip">Tip this post</button>
    <output id="result"></output>
    <script src="./app.js"></script>
  </body>
</html>
